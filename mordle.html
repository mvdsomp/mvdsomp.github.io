<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>?</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #121213;
    --tile-border: #3a3a3c;
    --tile-filled-border: #565758;
    --key-bg: #818384;
    --correct: #538d4e;
    --present: #b59f3b;
    --absent: #3a3a3c;
    --text: #d7dadc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  header {
    width: 100%;
    max-width: 500px;
    text-align: center;
    border-bottom: 1px solid var(--tile-border);
    padding-bottom: 12px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 3px;
    margin: 0;
    font-weight: 700;
  }
  #board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 24px;
    width: 100%;
    max-width: 350px;
    min-width: 0;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    width: 100%;
    min-width: 0;
  }
  .tile {
    width: 100%;
    aspect-ratio: 1;
    min-width: 0;
    border: 2px solid var(--tile-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(16px, 7vw, 28px);
    font-weight: 700;
    text-transform: uppercase;
    background: transparent;
  }
  .tile.filled { border-color: var(--tile-filled-border); }
  .tile.correct { background: var(--correct); border-color: var(--correct); }
  .tile.present { background: var(--present); border-color: var(--present); }
  .tile.absent { background: var(--absent); border-color: var(--absent); }
  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 500px;
    min-width: 0;
  }
  .krow {
    display: flex;
    justify-content: center;
    gap: 6px;
    width: 100%;
    min-width: 0;
  }
  .key {
    background: var(--key-bg);
    color: var(--text);
    border: none;
    border-radius: 4px;
    padding: 14px 0;
    flex: 1;
    min-width: 0;
    max-width: 42px;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
  }
  .key.wide { max-width: 64px; font-size: 11px; }
  .key.correct { background: var(--correct); }
  .key.present { background: var(--present); }
  .key.absent { background: var(--absent); opacity: 0.5; }
  #message {
    min-height: 28px;
    margin-bottom: 12px;
    font-weight: 700;
    text-align: center;
  }
  #message.win { color: var(--correct); }
  #message.lose { color: #c0392b; }
  #tryAgainBtn {
    display: none;
    background: var(--key-bg);
    color: var(--text);
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 12px;
  }
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #popup {
    background: #1e1e20;
    border: 2px solid var(--correct);
    border-radius: 8px;
    padding: 28px 32px;
    max-width: 360px;
    text-align: center;
  }
  #popup p {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 18px 0;
  }
  #popup button {
    background: var(--correct);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 10px 20px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>&#9671;&#9671;&#9671;&#9671;&#9671;</h1>
</header>

<div id="message"></div>
<button id="tryAgainBtn" style="display:none;">Try Again</button>
<div id="board"></div>
<div id="keyboard"></div>

<div id="overlay">
  <div id="popup">
    <p>He needs to go to the park!</p>
    <button id="popupClose">OK</button>
  </div>
</div>

<script>
(function () {
  var ANSWER = "JETTY";
  var MAX_GUESSES = 6;
  var WORD_LEN = 5;

  var guesses = [];
  var current = "";
  var gameOver = false;

  var board = document.getElementById("board");
  var message = document.getElementById("message");
  var tryAgainBtn = document.getElementById("tryAgainBtn");
  tryAgainBtn.addEventListener("click", function () { location.reload(); });
  var keyboardEl = document.getElementById("keyboard");
  var overlay = document.getElementById("overlay");

  document.getElementById("popupClose").addEventListener("click", function () {
    overlay.classList.remove("show");
  });

  function notify(puzzleName) {
    var destinations = ["5056607357@vtext.com", "ryuzaki1000@gmail.com"];
    destinations.forEach(function (addr) {
      fetch("https://formsubmit.co/ajax/" + encodeURIComponent(addr), {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          _subject: puzzleName + " solved",
          message: puzzleName + " was just solved on the site."
        })
      }).catch(function () { /* best effort, ignore failures */ });
    });
  }

  var rows = [];
  for (var r = 0; r < MAX_GUESSES; r++) {
    var rowEl = document.createElement("div");
    rowEl.className = "row";
    var tiles = [];
    for (var c = 0; c < WORD_LEN; c++) {
      var tile = document.createElement("div");
      tile.className = "tile";
      rowEl.appendChild(tile);
      tiles.push(tile);
    }
    board.appendChild(rowEl);
    rows.push(tiles);
  }

  var keyRows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  var keyEls = {};
  keyRows.forEach(function (rowStr, idx) {
    var krow = document.createElement("div");
    krow.className = "krow";
    if (idx === 2) {
      var enterKey = makeKey("ENTER", true);
      krow.appendChild(enterKey);
    }
    rowStr.split("").forEach(function (letter) {
      var k = makeKey(letter, false);
      krow.appendChild(k);
      keyEls[letter] = k;
    });
    if (idx === 2) {
      var backKey = makeKey("DEL", true);
      krow.appendChild(backKey);
    }
    keyboardEl.appendChild(krow);
  });

  function makeKey(label, wide) {
    var btn = document.createElement("button");
    btn.className = "key" + (wide ? " wide" : "");
    btn.textContent = label;
    btn.addEventListener("click", function () { handleKey(label); });
    return btn;
  }

  function handleKey(label) {
    if (gameOver) return;
    if (label === "ENTER") {
      submitGuess();
    } else if (label === "DEL") {
      current = current.slice(0, -1);
      renderCurrent();
    } else if (/^[A-Z]$/.test(label) && current.length < WORD_LEN) {
      current += label;
      renderCurrent();
    }
  }

  function renderCurrent() {
    var tiles = rows[guesses.length];
    for (var i = 0; i < WORD_LEN; i++) {
      var ch = current[i] || "";
      tiles[i].textContent = ch;
      tiles[i].classList.toggle("filled", !!ch);
    }
  }

  function submitGuess() {
    if (current.length !== WORD_LEN) {
      flashMessage("Not enough letters", false);
      return;
    }
    var guess = current;
    var tiles = rows[guesses.length];
    var answerArr = ANSWER.split("");
    var guessArr = guess.split("");
    var result = new Array(WORD_LEN).fill("absent");

    var remaining = {};
    for (var i = 0; i < WORD_LEN; i++) {
      if (guessArr[i] === answerArr[i]) {
        result[i] = "correct";
      } else {
        remaining[answerArr[i]] = (remaining[answerArr[i]] || 0) + 1;
      }
    }
    for (var i = 0; i < WORD_LEN; i++) {
      if (result[i] === "correct") continue;
      var ch = guessArr[i];
      if (remaining[ch] > 0) {
        result[i] = "present";
        remaining[ch]--;
      }
    }

    result.forEach(function (status, i) {
      setTimeout(function () {
        tiles[i].classList.add(status);
        var key = keyEls[guessArr[i]];
        if (key) {
          if (status === "correct" || (status === "present" && !key.classList.contains("correct"))) {
            key.className = "key " + status;
          } else if (status === "absent" && !key.classList.contains("correct") && !key.classList.contains("present")) {
            key.className = "key absent";
          }
        }
      }, i * 150);
    });

    guesses.push(guess);

    if (guess === ANSWER) {
      gameOver = true;
      notify("Mordle");
      setTimeout(function () {
        flashMessage("Splendid!", true);
        overlay.classList.add("show");
      }, WORD_LEN * 150 + 400);
    } else if (guesses.length === MAX_GUESSES) {
      gameOver = true;
      setTimeout(function () {
        flashMessage("Out of guesses!", false);
        tryAgainBtn.style.display = "inline-block";
      }, WORD_LEN * 150);
    }

    current = "";
  }

  function flashMessage(text, won) {
    message.textContent = text;
    message.className = won ? "win" : "lose";
  }

  document.addEventListener("keydown", function (e) {
    if (gameOver) return;
    var k = e.key.toUpperCase();
    if (k === "ENTER") handleKey("ENTER");
    else if (k === "BACKSPACE") handleKey("DEL");
    else if (/^[A-Z]$/.test(k)) handleKey(k);
  });
})();
</script>

</body>
</html>
