<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>?</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #fdfdfd;
    --text: #222;
    --tile-bg: #efefe6;
    --tile-selected: #5a594e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 2px;
    margin: 0 0 6px 0;
  }
  #sub {
    font-size: 13px;
    color: #777;
    margin-bottom: 20px;
    text-align: center;
  }
  #solved {
    width: 100%;
    max-width: 500px;
    margin-bottom: 8px;
  }
  .solved-row {
    width: 100%;
    border-radius: 8px;
    padding: 14px 10px;
    margin-bottom: 8px;
    text-align: center;
    font-weight: 700;
  }
  .solved-row .cat-name {
    display: block;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .solved-row .cat-words {
    display: block;
    font-weight: 500;
    font-size: 13px;
    margin-top: 2px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 500px;
    margin-bottom: 16px;
  }
  .tile {
    aspect-ratio: 1.3;
    background: var(--tile-bg);
    border-radius: 8px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    cursor: pointer;
    padding: 4px;
    user-select: none;
    transition: transform 0.1s;
  }
  .tile.selected {
    background: var(--tile-selected);
    color: #fff;
  }
  .tile.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  #message {
    min-height: 22px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  #mistakes {
    margin-bottom: 16px;
    font-size: 13px;
  }
  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--tile-selected);
    margin: 0 3px;
  }
  .dot.used { background: #ccc; }
  #controls {
    display: flex;
    gap: 10px;
  }
  #controls button {
    border: 1px solid #999;
    background: #fff;
    border-radius: 20px;
    padding: 10px 20px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  #controls button:disabled { opacity: 0.4; cursor: default; }
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    align-items: center;
    justify-content: center;
  }
  #overlay.show { display: flex; }
  #popup {
    background: #fff;
    border-radius: 8px;
    padding: 28px 32px;
    max-width: 360px;
    text-align: center;
  }
  #popup p { font-size: 18px; font-weight: 700; margin: 0 0 18px 0; }
  #popup button {
    background: #222;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 10px 20px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>&#9632;&#9632;&#9632;&#9632;</h1>
<div id="sub">Find four groups of four.</div>

<div id="solved"></div>
<div id="grid"></div>
<div id="message"></div>
<div id="mistakes"></div>
<div id="controls">
  <button id="deselectBtn">Deselect All</button>
  <button id="submitBtn" disabled>Submit</button>
</div>

<div id="overlay">
  <div id="popup">
    <p id="popupText"></p>
    <button id="popupClose">OK</button>
  </div>
</div>

<script>
(function () {
  var CATEGORIES = [
    { name: "Words following ring", color: "#f9df6d", words: ["WORM", "MASTER", "TONE", "FINGER"] },
    { name: "Where you're going next", color: "#a0c35a", words: ["BURGER", "SOCCER", "ALPINE", "BOCCE"] },
    { name: "Parts of the names of places on moom and hoom trips", color: "#b0c4ef", words: ["SHELLY", "DEW", "SAND", "RIVER"] },
    { name: "First Date", color: "#ba81c5", words: ["BREADMAN", "BIRDS", "ART", "SPONGEBOB"] },
  ];
  var MAX_MISTAKES = 4;

  var selected = [];
  var solvedCategories = [];
  var mistakesUsed = 0;
  var gameOver = false;

  var grid = document.getElementById("grid");
  var solvedEl = document.getElementById("solved");
  var message = document.getElementById("message");
  var mistakesEl = document.getElementById("mistakes");
  var submitBtn = document.getElementById("submitBtn");
  var deselectBtn = document.getElementById("deselectBtn");
  var overlay = document.getElementById("overlay");
  var popupText = document.getElementById("popupText");

  var allWords = [];
  CATEGORIES.forEach(function (cat) {
    cat.words.forEach(function (w) {
      allWords.push({ word: w, category: cat });
    });
  });

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  shuffle(allWords);

  function renderMistakes() {
    mistakesEl.innerHTML = "";
    for (var i = 0; i < MAX_MISTAKES; i++) {
      var dot = document.createElement("span");
      dot.className = "dot" + (i < mistakesUsed ? " used" : "");
      mistakesEl.appendChild(dot);
    }
  }

  function renderGrid() {
    grid.innerHTML = "";
    allWords.forEach(function (item) {
      if (item.solved) return;
      var btn = document.createElement("button");
      btn.className = "tile" + (selected.indexOf(item) !== -1 ? " selected" : "");
      btn.textContent = item.word;
      btn.addEventListener("click", function () { toggleSelect(item); });
      grid.appendChild(btn);
    });
    submitBtn.disabled = selected.length !== 4;
    deselectBtn.disabled = selected.length === 0;
  }

  function toggleSelect(item) {
    if (gameOver) return;
    var idx = selected.indexOf(item);
    if (idx !== -1) {
      selected.splice(idx, 1);
    } else if (selected.length < 4) {
      selected.push(item);
    }
    renderGrid();
  }

  function renderSolved() {
    solvedEl.innerHTML = "";
    solvedCategories.forEach(function (cat) {
      var row = document.createElement("div");
      row.className = "solved-row";
      row.style.background = cat.color;
      row.innerHTML = "<span class='cat-name'>" + cat.name + "</span>" +
                       "<span class='cat-words'>" + cat.words.join(", ") + "</span>";
      solvedEl.appendChild(row);
    });
  }

  function flash(text) {
    message.textContent = text;
  }

  function checkWin() {
    if (solvedCategories.length === CATEGORIES.length) {
      gameOver = true;
      flash("Solved it!");
      setTimeout(function () {
        popupText.textContent = "Ask for the hoom special";
        overlay.classList.add("show");
      }, 500);
    }
  }

  document.getElementById("submitBtn").addEventListener("click", function () {
    if (selected.length !== 4 || gameOver) return;
    var cat = selected[0].category;
    var allSameCategory = selected.every(function (item) { return item.category === cat; });

    if (allSameCategory) {
      selected.forEach(function (item) { item.solved = true; });
      solvedCategories.push(cat);
      selected = [];
      flash("");
      renderSolved();
      renderGrid();
      checkWin();
      return;
    }

    var matchCount = selected.filter(function (item) { return item.category === cat; }).length;
    var maxMatch = 0;
    CATEGORIES.forEach(function (c) {
      var count = selected.filter(function (item) { return item.category === c; }).length;
      if (count > maxMatch) maxMatch = count;
    });

    mistakesUsed++;
    renderMistakes();

    if (maxMatch === 3) {
      flash("One away...");
    } else {
      flash("Not quite.");
    }

    var tiles = grid.querySelectorAll(".tile.selected");
    tiles.forEach(function (t) { t.classList.add("shake"); });
    setTimeout(function () {
      tiles.forEach(function (t) { t.classList.remove("shake"); });
    }, 400);

    if (mistakesUsed >= MAX_MISTAKES) {
      gameOver = true;
      CATEGORIES.forEach(function (cat) {
        if (solvedCategories.indexOf(cat) === -1) {
          solvedCategories.push(cat);
        }
      });
      renderSolved();
      allWords.forEach(function (item) { item.solved = true; });
      renderGrid();
      flash("Out of guesses.");
    }
  });

  deselectBtn.addEventListener("click", function () {
    selected = [];
    renderGrid();
  });

  document.getElementById("popupClose").addEventListener("click", function () {
    overlay.classList.remove("show");
  });

  renderMistakes();
  renderGrid();
})();
</script>

</body>
</html>
